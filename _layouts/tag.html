---
layout: default
---

<main class="stack-lg">

  <header class="stack">
    <nav aria-label="Breadcrumb">
      <p class="meta">
        <a href="/">Maikhel</a> · <a href="/tags/">Topics</a>
      </p>
    </nav>

    <h1>#{{ page.tag }}</h1>

    {% if page.description %}
      <p class="meta">{{ page.description }}</p>
    {% endif %}
  </header>

  <section class="stack">
    {% assign posts = site.tags[page.tag] %}
    {% for post in posts %}
      <article>
        <h2>
          <a href="{{ post.url }}">{{ post.title }}</a>
        </h2>

        <p class="meta">
          <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %d, %Y" }}</time>
        </p>

        <p>{{ post.description | strip_html }}</p>
      </article>
    {% endfor %}
  </section>

</main>
