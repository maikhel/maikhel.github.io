<article class="preview">
  <div class="preview-content">
    <img src="{{ post.min_image | default: post.image | relative_url }}" alt="" width="180" height="120" loading="lazy" decoding="async" data-vt-image>

    <div class="preview-text">
      {% assign level = include.level | default: 3 %}
      <h{{ level }}><a href="{{ post.url | relative_url }}" data-vt-title>{{ post.title }}</a></h{{ level }}>
      <p class="meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %d, %Y" }}</time></p>
      <p>{{ post.description | strip_html }}</p>
    </div>

  </div>
</article>
