<article class="preview">
  <div class="preview-content">
    <img src="{{ post.min_image | default: post.image | relative_url }}" alt="{{ post.title }}" loading="lazy" decoding="async" data-vt-image>

    <div class="preview-text">
      <h3><a href="{{ post.url | relative_url }}" data-vt-title>{{ post.title }}</a></h3>
      <p class="meta">{{ post.date | date: "%B %d, %Y" }}</p>
      <p>{{ post.description | strip_html }}</p>
    </div>

  </div>
</article>
